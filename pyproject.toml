[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "invaria"
version = "0.1.0"
description = "Evidence-first application security analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1",
  "tree-sitter==0.25.2", "tree-sitter-javascript>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<0.24", "httpx>=0.28,<1",
  "pypdf>=5.0,<7", "python-docx>=1.1,<2", "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
scanner = ["semgrep>=1.100,<2; sys_platform != 'win32'"]

[project.scripts]
invaria = "invaria.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
invaria = ["knowledge/*.json", "rules/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
